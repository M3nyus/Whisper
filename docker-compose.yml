version: "3.9"

services:
  app:
    build: .
    container_name: whisper-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      APP_DEBUG: "False"
    volumes:
      - ./log:/app/log
      - ./output:/app/output

  redis:
    image: redis:7-alpine
    container_name: whisper-redis
    ports:
      - "6379:6379"