<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">


  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <title>Whisper</title>
</head>

<body>
  <div class="parent">
    <div class="div1">
      <h1>Feliratozás</h1>
    </div>

    <div class="div3">
      <h3>MP3 fájlok kiválasztása</h3>
      <div class="mb-3">
        <select id="mp3Select" class="form-select">
            {% for file in mp3_files %}
                <option value="{{ file.name }}">{{ file.name }} ({{ file.duration }})</option>
            {% endfor %}
        </select>
      </div>

      <button class="btn btn-primary" onclick="startMp3Transcription()">Feliratozás</button>
      <button class="btn btn-primary" onclick="clearText()">Clear</button>
      <button class="btn btn-primary" onclick="goBack()">Vissza</button>

      <div class="div3 mt-4 bot-active" id="mainBotDiv">
        <h5>Felirat</h5>

        <div class="progress mt-3">
          <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%">
            0%
          </div>
        </div>

        <div class="bg-white" id="res"></div>
      </div>

      <div class="mt-3">
          <button class="btn btn-danger" onclick="shutdownServer()">Program leállítása</button>
      </div>
    </div>
  </div>

  <script>
    let currentFileName = null;
    let currentKey = null;
    let uuid = "";

    $(document).ready(function() {
        $.getJSON("/API/getUuid", function(response) {
            uuid = response.uuid;
            console.log("Jelenlegi UUID:", uuid);
        });
    });

    function shutdownServer() {

      Swal.fire({
        title: 'Vigyázz!',
        text: "Biztos le akarod állítani a programot?",
        icon: 'error',
        showCancelButton: true,
        confirmButtonColor: '#b91c1c',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Igen',
        cancelButtonText: 'Nem'
      }).then((result) => {

        if (result.isConfirmed) {

          if (!uuid) {
            Swal.fire('Hiba', 'UUID nem érhető el!', 'error');
            return;
          }

          $.ajax({
            url: "/API/programStop",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ uuid: uuid }),
            dataType: "json",
            success: function(response) {
              window.location.href = "/API/stopped";
              console.log("Leállítás sikeres:", response);
            },
            error: function(err) {
              console.error("Leállítás sikertelen:", err);
              Swal.fire('Hiba!', 'Nem sikerült leállítani.', 'error');
            }
          });

        }
      });
    }

    function startMp3Transcription() {
        const fileName = $('#mp3Select').val();
        currentFileName = fileName;

        if (!fileName) {
            alert("Válassz egy mp3 fájlt!");
            return;
        }

        $('#res').html("Feliratozás folyamatban...");

        startProgressPolling();

        $.ajax({
            url: "/API/getMp3/translate",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ fileName: fileName }),
            success: function(data) {
                currentKey = data.key;

                if(data.text){
                    $('#res').html(data.text);
                } else if(data.error){
                    $('#res').html("Hiba: " + data.error);
                }
            },
            error: function(err){
                console.error(err);
                $('#res').html("Hiba történt a feliratozás során!");
            }
        });
    }

      function goBack() {
            window.location.href = "/";
      }

      function clearText() {
            if (!currentKey) {
                Swal.fire('Figyelem!', "Nincs törölhető adat!", 'info');
                return;
            }

            Swal.fire({
                title: 'Biztos törlöd?',
                text: "Ez törölni fogja a feliratozási adatokat és a hangfájlokat a mp3/hang mappában!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Törlés',
                cancelButtonText: 'Mégse'
            }).then((result) => {
                if (result.isConfirmed) {
                    $.ajax({
                        url: "/API/getMp3/clear",
                        type: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ key: currentKey }),
                        success: function(response) {
                            $('#res').html("");
                            $('#progressBar').css('width', '0%').text('0%');
                            currentKey = null;

                            Swal.fire('Törölve!', 'Az adatok és a hangfájlok törölve lettek.', 'success');
                        },
                        error: function() {
                            Swal.fire('Hiba!', 'Nem sikerült törölni az adatokat.', 'error');
                            alert("Hiba a törlésnél!");
                        }
                    });
                }
            });
      }


      let progressInterval = null;
        function startProgressPolling() {
            progressInterval = setInterval(function () {

                if (!currentFileName) return;

                $.get("/API/getMp3/progress/" + currentFileName, function (data) {
                    if (data.total > 0) {
                        let percent = Math.floor((data.curr / data.total) * 100);
                        $('#progressBar').css('width', percent + '%');
                        $('#progressBar').text(percent + '%');

                        if (percent >= 100) {
                            clearInterval(progressInterval);
                        }
                    }
                });
            }, 1000);
        }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>

</html>
