<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">


  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <title>Whisper</title>
</head>

<body>
  <div class="parent">
    <div class="div1">
      <h1>Feliratozás</h1>
    </div>

    <div class="div3">
      <h3>MP3 fájlok kiválasztása</h3>
      <div class="mb-3">
        <select id="mp3Select" class="form-select">
            {% for file in mp3_files %}
                <option value="{{ file }}">{{ file }}</option>
            {% endfor %}
        </select>
      </div>

      <button class="btn btn-primary" onclick="startMp3Transcription()">Feliratozás</button>
      <button class="btn btn-primary" onclick="clearText()">Clear</button>
      <button class="btn btn-primary" onclick="goBack()">Vissza</button>

      <div class="div3 mt-4 bot-active" id="mainBotDiv">
        <h5>Felirat</h5>

        <div class="progress mt-3">
          <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%">
            0%
          </div>
        </div>

        <div class="bg-white" id="res"></div>
      </div>

      <div class="mt-3">
          <button class="btn btn-danger" onclick="shutdownServer()">Program leállítása</button>
      </div>
    </div>
  </div>

  <script>
    function shutdownServer() {
        $.get('/API/programStop')
          .fail(function() {
              console.error('Failed to fetch.');
          });
    }

    function startMp3Transcription() {
    const fileName = $('#mp3Select').val();
    if (!fileName) {
        alert("Válassz egy mp3 fájlt!");
        return;
    }

    $('#res').html("Feliratozás folyamatban...");

    startProgressPolling();

    $.ajax({
        url: "/API/getMp3/translate",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ fileName: fileName }),
        success: function(data) {
            if(data.text){
                $('#res').html(data.text);
            } else if(data.error){
                $('#res').html("Hiba: " + data.error);
            }
        },
        error: function(err){
            console.error(err);
            $('#res').html("Hiba történt a feliratozás során!");
        }
    });
}

      function goBack() {
            window.location.href = "/";
      }

      function clearText() {
        $.ajax({
            url: "/API/getMp3/clear",
            type: "POST",
            success: function() {
                $('#res').html("");

                $('#progressBar').css('width', '0%');
                $('#progressBar').text('0%');
            },
            error: function() {
                alert("Hiba a törlésnél!");
            }
        });
    }


      let progressInterval = null;
        function startProgressPolling() {
            progressInterval = setInterval(function () {
                $.get("/API/getMp3/progress", function (data) {
                    if (data.total > 0) {
                        let percent = Math.floor((data.current / data.total) * 100);
                        $('#progressBar').css('width', percent + '%');
                        $('#progressBar').text(percent + '%');

                        if (percent >= 100) {
                            clearInterval(progressInterval);
                        }
                    }
                });
            }, 1000); // 1 mp
        }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>

</html>
