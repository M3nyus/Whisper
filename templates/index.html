<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">


  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <title>Whisper</title>
</head>

<body>
  <div class="parent">
    <div class="div1">
      <h1>Feliratozás</h1>
    </div>

    <div class="div3">
      <h1>Funkciók</h1>
      <div class="mb-3">
        <label class="form-label">Add room</label>
        <input type="text" id="roomName" class="form-control" placeholder="room name">
      </div>

      <button class="btn btn-primary" onclick="startRoom()">Add room</button>
      <button class="btn btn-primary" onclick="isRoomActive()">Get latest timestampId</button>
      <button class="btn btn-primary" onclick="listRooms()">List rooms</button>
      <button id="toggleBotBtn" class="btn btn-primary" onclick="toggleBotInput()">Több Bot létrehozása</button>
      <button class="btn btn-primary" onclick="mp3Page()">MP3 lekérése</button>
      <button id="modeButton" class="btn btn-primary" onclick="toggleMode()">Módváltás (Demo)</button>

      <div id="plusBot" class="mt-3">
        <input type="text" id="plusBots" class="form-control" placeholder="Új bot szobanév">
        <button class="btn btn-primary" onclick="addPlusBot()">Létrehoz</button>
      </div>

      <div id="alapAdat"></div>

      <div class="div3 mt-4 bot-active" id="mainBotDiv">
        <h5 id="mainBotName">Bot - Off</h5>

        <div class="mb-3">
              <label class="form-label">Room</label>
              <input type="text" id="roomId" class="form-control" placeholder="Room Name">
        </div>

        <div class="mb-3">
              <label class="form-label">Timestamp ID</label>
              <input type="text" id="timestampId" class="form-control" placeholder="Timestamp ID">
        </div>

        <div id="roomActions">
            <button class="btn btn-primary" onclick="getLastText()">getLastText</button>
            <button class="btn btn-primary" onclick="roomStatus()">Get Room Status</button>
            <button class="btn btn-primary" onclick="botPause()">Bot Pause</button>
            <button class="btn btn-primary" onclick="botResume()">Bot Resume</button>
            <button class="btn btn-danger" onclick="stopRoom()">Kill room (recorder bot)</button>
      </div>

            <div class="bg-white" id="res"></div>
      </div>

      <div id="extraBotsContainer" class="mt-4"></div>

        <div class="mt-3">
            <button class="btn btn-danger" onclick="shutdownServer()">Program leállítása</button>
          </div>
    </div>
  </div>

  <script>
    let plusBotIndex = 0;
    let currentMode = "live";
    let uuid = "";

    $(document).ready(function() {
        $.getJSON("/API/getUuid", function(response) {
            uuid = response.uuid;
            console.log("Jelenlegi UUID:", uuid);
        });
    });

    $(document).ready(function() {
        $.getJSON("/API/getMode", function(response) {
            currentMode = response.mode;
            $('#modeButton').text(`Módváltás (${currentMode})`);
        }).fail(function(err) {
            console.error("Hiba a mód lekérésénél:", err);
        });
    });

    function botPause() {
        const roomId = $('#roomId').val().trim();
        $.getJSON('/API/recorderPause/' + roomId, function(data) {
            $('#mainBotDiv').removeClass('bot-active').addClass('bot-paused');
        }).fail(function(err) {
            console.error('Failed to fetch.');
        });
    }

    function botResume() {
        const roomId = $('#roomId').val().trim();
        $.getJSON('/API/resumeRecording/' + roomId, function(data) {
            $('#mainBotDiv').removeClass('bot-paused').addClass('bot-active');
        }).fail(function(err) {
            console.error('Failed to fetch.');
        });
    }

    function startRoom() {
        const roomName = $('#roomName').val().trim();
      if (!roomName) {
        alert("Adj meg egy szobanevet!");
        return;
      }
      $.getJSON('API/startRoom/' + $('#roomName').val(), function (data) {
        $('#mainBotName').text('Bot - ' + roomName);
         $('#roomId').val(roomName);
        $('#timestampId').val(data.timestampId)
        if (data.timestampId) {
          $('#roomActions').fadeIn();
        }
      }).fail(function () {
        console.error('Failed to fetch.');
      });
    }

    function listRooms() {
      $.getJSON('API/listRooms', function (data) {
        $('#alapAdat').html(JSON.stringify(data))

        if ($('#alapAdat').is(':hidden')) {
          $('#alapAdat').slideDown(300);
        }

      }).fail(function () {
        console.error('Failed to fetch.');
      });
    }

    function roomStatus() {
      $.getJSON('API/roomStatus/' + $('#roomId').val() + '/' + $('#timestampId').val(), function (data) {
        $('#res').html(JSON.stringify(data))
      }).fail(function () {
        console.error('Failed to fetch.');
      });
    }

    function isRoomActive() {
      $.getJSON('API/isRoomActive/' + $('#roomName').val(), function (data) {
        $('#alapAdat').html(JSON.stringify(data))

        if ($('#alapAdat').is(':hidden')) {
          $('#alapAdat').slideDown(300);
        }

      }).fail(function () {
        console.error('Failed to fetch.');
      });
    }

    function stopRoom() {
      const room = $('#roomName').val();
      const timestamp = $('#timestampId').val();

      Swal.fire({
        title: 'Biztos vagy benne?',
        text: `Ez leállítja a(z) "${room}" botot!`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Igen',
        cancelButtonText: 'Mégse'
      }).then((result) => {
        if (result.isConfirmed) {
          $.getJSON('API/stopRoom/' + room + '/' + timestamp, function (data) {
            $('#res').html(JSON.stringify(data))
            }).fail(function () {
                console.error('Bot leállítása sikertelen.');
            });

            Swal.fire(
              'Leállítva!',
              `A(z) "${room}" bot le lett állítva.`,
              'success'
            ).then(() => {
              resetMainBotUI();
            });
        }
      });
    }

    function getLastText() {
      $.getJSON('API/getLastText/' + $('#roomName').val(), function (data) {
        $('#res').html(JSON.stringify(data))
        setTimeout(getLastText, 5000);
      }).fail(function () {
        console.error('Failed to fetch.');
      });
    }

    function toggleBotInput() {
      $('#plusBot').slideToggle(300);

      $('#toggleBotBtn').toggleClass('btn-primary btn-warning-custom');
    }

    function addPlusBot() {
      let roomName = $('#plusBots').val();
      if (!roomName) {
        alert("Adj meg egy szobanevet!");
        return;
      }

      $.getJSON('API/addPlusBot/' + roomName, function (data) {
        plusBotIndex++;

        // csak a második gomb és további botokhoz nincs "Add room"
        let newBotHtml = `
          <hr class="my-4">
          <div class="div3 mt-4 bot-active" id="extraBot_${plusBotIndex}">
            <h5>Bot - ${roomName}</h5>

            <div class="mb-3">
              <label class="form-label">Room</label>
              <input type="text" id="roomName_${plusBotIndex}" class="form-control" value="${roomName}">
            </div>

            <div class="mb-3">
              <label class="form-label">Timestamp ID</label>
              <input type="text" id="timestampId_${plusBotIndex}" class="form-control" value="${data.timestampId}">
            </div>

            <button class="btn btn-primary" onclick="getLastTextExtra(${plusBotIndex})">getLastText</button>
            <button class="btn btn-primary" onclick="statusExtraRoom(${plusBotIndex})">Get Room Status</button>
            <button class="btn btn-primary" onclick="botPauseExtra(${plusBotIndex})">Bot Pause</button>
            <button class="btn btn-primary" onclick="botResumeExtra(${plusBotIndex})">Bot Resume</button>
            <button class="btn btn-danger" onclick="stopExtraRoom(${plusBotIndex})">Kill room (recorder bot)</button>

            <div class="bg-white mt-3 p-3 rounded" id="res_${plusBotIndex}"></div>


        `;

        $('#extraBotsContainer').append(newBotHtml);
        $('#plusBots').val("");
      }).fail(function () {
        console.error('Failed to create plus bot.');
      });
    }

    function stopExtraRoom(id) {
      let room = $('#roomName_' + id).val();
      let timestamp = $('#timestampId_' + id).val();

      Swal.fire({
        title: 'Biztos?',
        text: `Ez leállítja a(z) "${room}" botot!`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        confirmButtonText: 'Igen',
        cancelButtonText: 'Mégse'
      }).then((result) => {
        if (result.isConfirmed) {
          $.getJSON('API/stopRoom/' + room + '/' + timestamp, function (data) {
            $('#res_' + id).html(JSON.stringify(data));

            Swal.fire('Kész!', 'Bot leállítva.', 'success').then(() => {
              $('#extraBot_' + id).remove();
            });
          });
        }
      });
    }

    function statusExtraRoom(id) {
      let room = $('#roomName_' + id).val();
      let timestamp = $('#timestampId_' + id).val();
      $.getJSON('API/roomStatus/' + room + '/' + timestamp, function (data) {
        $('#res_' + id).html(JSON.stringify(data));
      });
    }

    function getLastTextExtra(id) {
      let room = $('#roomName_' + id).val();
      $.getJSON('API/getLastText/' + room, function (data) {
        $('#res_' + id).html(JSON.stringify(data));
        setTimeout(function () { getLastTextExtra(id); }, 5000);
      });
    }

    function botPauseExtra(id) {
        const roomId = $('#roomName_' + id).val().trim();

        $.getJSON('/API/recorderPause/' + roomId, function(data) {
            $('#extraBot_' + id).removeClass('bot-active').addClass('bot-paused');
        }).fail(function() {
            console.error('Failed to fetch.');
        });
    }

    function botResumeExtra(id) {
        const roomId = $('#roomName_' + id).val().trim();

        $.getJSON('/API/recorderResume/' + roomId, function(data) {
            $('#extraBot_' + id).removeClass('bot-paused').addClass('bot-active');
        }).fail(function() {
            console.error('Failed to fetch.');
        });
    }

    function resetMainBotUI() {
      $('#mainBotName').text('Bot - Off');
      $('#roomId').val('');
      $('#timestampId').val('');
      $('#res').html('');

      $('#roomActions').fadeOut();

      $('#mainBotDiv')
        .removeClass('bot-paused')
        .addClass('bot-active');
    }

    function shutdownServer() {

      Swal.fire({
        title: 'Vigyázz!',
        text: "Biztos le akarod állítani a programot?",
        icon: 'error',
        showCancelButton: true,
        confirmButtonColor: '#b91c1c',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Igen',
        cancelButtonText: 'Nem'
      }).then((result) => {

        if (result.isConfirmed) {

          if (!uuid) {
            Swal.fire('Hiba', 'UUID nem érhető el!', 'error');
            return;
          }

          $.ajax({
            url: "/API/programStop",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ uuid: uuid }),
            dataType: "json",
            success: function(response) {
              window.location.href = "/API/stopped";
              console.log("Leállítás sikeres:", response);
            },
            error: function(err) {
              console.error("Leállítás sikertelen:", err);
              Swal.fire('Hiba!', 'Nem sikerült leállítani.', 'error');
            }
          });

        }
      });
    }

    function mp3Page() {
        window.location.href = "/API/getMp3";
    }

    function toggleMode() {
        const newMode = currentMode === "demo" ? "live" : "demo";

        $.ajax({
            url: "/API/changeMode",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({ mode: newMode }),
            success: function(response) {
                currentMode = response.mode;
                 $('#modeButton').text(`Módváltás (${currentMode})`);
                console.log("Mode changed:", response);
            },
            error: function(err) {
                console.error("Hiba a módváltásnál:", err);
                alert("Hiba a módváltásnál.");
            }
        });
    }

  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>

</html>
